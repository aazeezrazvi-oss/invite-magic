<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Envelope Icon -->
  <g transform="translate(10, 15)">
    <!-- Top-Right Sparkle -->
    <polygon points="68,8 71,20 83,23 71,26 68,38 65,26 53,23 65,20" fill="url(#gold)" filter="url(#glow)" />
    <!-- Bottom-Left Sparkle -->
    <polygon points="18,74 20,80 26,82 20,84 18,90 16,84 10,82 16,80" fill="url(#gold)" />
    <!-- Outer Envelope Box -->
    <rect x="14" y="28" width="68" height="48" rx="8" ry="8" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner V-Line -->
    <path d="M16 30 L48 56 L80 30" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text: Invite Magic -->
  <text x="115" y="65" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="1">Invite<tspan fill="url(#gold)">Magic</tspan></text>

  <!-- Subtitle: DIGITAL WEDDING INVITATIONS -->
  <text x="117" y="88" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#c5a880" letter-spacing="4">DIGITAL WEDDING INVITATIONS</text>
</svg>
